<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的診所資訊系統 · Solo GP Clinic System</title>
<style>
:root{
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --primary:#2563eb;--primary-soft:#dbeafe;--danger:#e11d48;--danger-soft:#ffe4e6;
  --success:#059669;--success-soft:#d1fae5;--warning:#d97706;--warning-soft:#fef3c7;
  --violet:#7c3aed;--violet-soft:#ede9fe;--orange:#ea580c;--orange-soft:#ffedd5;
  --dark:#0f172a;--shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
img{max-width:100%;display:block}
.hint{font-size:12px;color:#64748b;line-height:1.45}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f172a,#1e293b);padding:20px}
.auth-card{background:#fff;border-radius:24px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(15,23,42,.35)}
.auth-card h1{margin:0 0 6px;font-size:22px;font-weight:900}
.auth-card .sub{margin:0 0 24px;color:var(--muted);font-size:13px}
.auth-error{font-size:13px;margin:10px 0 0;min-height:18px;color:var(--danger)}
.auth-links{margin-top:16px;text-align:center;font-size:12px}
.auth-links a{color:var(--primary);cursor:pointer;text-decoration:underline}

.app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}
.sidebar{background:linear-gradient(180deg,#0f172a 0%, #111827 100%);color:#fff;padding:24px 18px;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto}
.brand{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}
.brand-logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 12px 30px rgba(96,165,250,.35);flex-shrink:0}
.brand h1{font-size:19px;margin:0;font-weight:900}
.brand p{margin:6px 0 0;color:#cbd5e1;font-size:12px;line-height:1.45}
.nav{display:flex;flex-direction:column;gap:10px}
.nav button{width:100%;border:none;background:rgba(255,255,255,.05);color:#e2e8f0;text-align:left;padding:14px 16px;border-radius:16px;cursor:pointer;font-weight:800;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button.active{background:#fff;color:#0f172a}
.sidebar-card{margin-top:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px}
.sidebar-card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1}
.sidebar-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-stat{background:rgba(255,255,255,.09);border-radius:16px;padding:12px}
.mini-stat .label{color:#cbd5e1;font-size:12px}
.mini-stat .value{margin-top:6px;font-size:22px;font-weight:900}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#cbd5e1}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
.sync-badge.ok .sync-dot{background:#10b981}
.sync-badge.saving .sync-dot{background:#f59e0b;animation:pulse-dot 1s infinite}
.sync-badge.error .sync-dot{background:#ef4444}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.25}}

.main{padding:24px;overflow:auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:30px;line-height:1.08;font-weight:900}
.topbar p{margin:8px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:16px;padding:11px 16px;cursor:pointer;font-weight:800;transition:.2s}
.btn.default{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.default:hover{background:#f8fafc}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{background:var(--danger);color:#fff}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.success{background:var(--success-soft);color:var(--success)}
.btn.warning{background:var(--warning-soft);color:var(--warning)}

.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.layout-2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.layout-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;background:#f8fafc;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h3{margin:0;font-size:17px;font-weight:900}
.card-head p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.card-body{padding:20px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stat-card .label{color:var(--muted);font-size:14px}
.stat-card .value{margin-top:8px;font-size:32px;font-weight:900}
.list{display:flex;flex-direction:column;gap:12px}
.list-item{border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item-title{font-weight:800}
.item-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.blue{background:#dbeafe;color:#1d4ed8}.emerald{background:#d1fae5;color:#047857}
.violet{background:#ede9fe;color:#6d28d9}.amber{background:#fef3c7;color:#b45309}
.rose{background:#ffe4e6;color:#be123c}.slate{background:#e2e8f0;color:#334155}
.orange{background:#ffedd5;color:#c2410c}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select,.toolbar textarea,.field input,.field select,.field textarea{
  width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:11px 12px;outline:none}
.toolbar input:focus,.toolbar select:focus,.toolbar textarea:focus,
.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #dbeafe}
.toolbar .search{flex:1 1 260px}
.toolbar .filter{width:180px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#64748b;background:#f8fafc}
.table-actions{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{border:none;border-radius:12px;padding:8px 10px;cursor:pointer;font-weight:800;background:#fff;border:1px solid var(--line)}
.icon-btn:hover{background:#f8fafc}
.icon-btn.danger{color:#be123c;background:#fff1f2;border-color:#fecdd3}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

.modal-backdrop,.drawer-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:none}
.modal-backdrop.show,.drawer-backdrop.show{display:block}
.modal{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(1180px, calc(100vw - 24px));max-height:92vh;overflow:auto;background:#fff;border-radius:28px;box-shadow:0 30px 80px rgba(15,23,42,.25);z-index:90;display:none}
.modal.show{display:block}
.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:5}
.modal-head h3{margin:0;font-size:22px;font-weight:900}
.modal-head p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.field label{display:block;margin-bottom:8px;font-size:14px;font-weight:800;color:#475569}
.span-2{grid-column:span 2}
.span-3{grid-column:span 3}
.section-block{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fcfdff}
.section-title{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:12px}

.doc-layout{display:grid;grid-template-columns:380px 1fr;gap:20px}
.doc-paper-wrap{background:#e2e8f0;border-radius:24px;padding:20px;overflow:auto}
.doc-paper{width:210mm;min-height:297mm;background:#fff;margin:0 auto;box-shadow:0 12px 36px rgba(15,23,42,.16);border-radius:4px;position:relative;color:#111827;font-family:Arial,"PMingLiU","MingLiU",sans-serif}
.doc-page{padding:18mm 16mm 18mm 16mm;min-height:297mm}
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #111827;padding-bottom:10px;margin-bottom:18px}
.doc-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
.doc-clinic h1{margin:0;font-size:24px;font-weight:900}
.doc-clinic p{margin:6px 0 0;font-size:13px;line-height:1.45;color:#334155}
.doc-title{text-align:center;font-size:24px;font-weight:900;margin:22px 0 18px;letter-spacing:2px}
.doc-block{margin-top:14px;font-size:14.5px;line-height:1.9;white-space:pre-wrap}
.doc-line{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:14px}
.doc-line .k{font-weight:700;color:#334155}
.doc-footer{margin-top:36px;display:flex;justify-content:space-between;gap:20px;align-items:flex-end}
.doc-sign{margin-top:0;text-align:right;font-size:14px;line-height:1.5}
.doc-rx-table{width:100%;border-collapse:collapse;margin-top:16px;min-width:unset}
.doc-rx-table th,.doc-rx-table td{border:1px solid #cbd5e1;padding:10px 8px;font-size:14px;background:#fff}
.doc-rx-table th{background:#f8fafc;color:#111827}
.doc-note{font-size:13px;color:#475569;line-height:1.7}

.drawer{position:fixed;top:0;right:0;height:100vh;width:min(760px,100vw);background:#fff;z-index:95;box-shadow:-20px 0 60px rgba(15,23,42,.18);transform:translateX(100%);transition:.25s ease;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.drawer-head h3{margin:0;font-size:20px;font-weight:900}
.drawer-head p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.drawer-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}
.detail .k{font-size:12px;color:var(--muted)}
.detail .v{margin-top:6px;font-weight:800;word-break:break-word}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab-btn{border:none;padding:10px 14px;border-radius:14px;background:#e2e8f0;color:#334155;font-weight:800;cursor:pointer}
.tab-btn.active{background:#dbeafe;color:#1d4ed8}
.subtab{display:none}
.subtab.active{display:block}

.img-upload{border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center;cursor:pointer;position:relative;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff}
.img-upload:hover{border-color:#60a5fa;background:#f0f7ff}
.img-upload img{max-height:56px;object-fit:contain;display:none}
.img-upload.has-img img{display:block}
.img-upload.has-img .img-plus,.img-upload.has-img .img-label{display:none}
.img-plus{font-size:22px;color:#cbd5e1}
.img-label{font-size:12px;color:var(--muted);font-weight:800}
.img-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:#e11d48;color:#fff;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1}
.img-upload.has-img .img-remove{display:flex}

.toast{position:fixed;right:18px;bottom:18px;z-index:120;background:#0f172a;color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 20px 50px rgba(15,23,42,.25);display:none;max-width:460px;font-weight:700}
.toast.show{display:block}

@media print{
  body *{visibility:hidden !important}
  #printArea, #printArea *{visibility:visible !important}
  #printArea{position:absolute;left:0;top:0;width:100%;background:#fff;padding:0;margin:0}
  #printArea .doc-paper{width:210mm !important;min-height:297mm !important;margin:0 !important;box-shadow:none !important}
}
@media (max-width:1280px){
  .grid-6{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .layout-2,.layout-3,.doc-layout{grid-template-columns:1fr}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}
  .form-grid{grid-template-columns:1fr 1fr}
  .span-3{grid-column:span 2}
}
@media (max-width:640px){
  .main{padding:16px}
  .grid-6,.grid-4{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .span-2,.span-3{grid-column:span 1}
  .detail-grid{grid-template-columns:1fr}
  .topbar h2{font-size:24px}
  .toolbar .filter{width:100%}
  .doc-paper-wrap{padding:12px}
  .doc-paper{width:100%;min-height:auto}
  .doc-page{padding:14px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1>✚ 醫生登入</h1>
    <p class="sub">Solo GP Clinic Information System</p>
    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="field" style="margin-bottom:14px">
        <label>Email</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>密碼</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn primary" style="width:100%">登入</button>
      <p class="auth-error" id="authError"></p>
    </form>
    <div class="auth-links"><a onclick="handleForgotPassword()">忘記密碼？</a></div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">✚</div>
      <div>
        <h1 id="brandClinicName">我的家庭醫務所</h1>
        <p>Solo GP Clinic System<br>雲端同步 / Supabase</p>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-card">
      <h3>今日概覽</h3>
      <div class="sidebar-grid">
        <div class="mini-stat"><div class="label">今日預約</div><div class="value" id="miniTodayAppt">0</div></div>
        <div class="mini-stat"><div class="label">今日收入</div><div class="value" id="miniTodayIncome">0</div></div>
      </div>
    </div>
    <div class="sidebar-card">
      <h3>帳戶</h3>
      <div class="sync-badge" id="syncBadge"><span class="sync-dot"></span><span id="syncText">未同步</span></div>
      <div style="font-size:12px;color:#94a3b8;margin:10px 0" id="loggedInEmail"></div>
      <button class="btn default" style="width:100%;margin-bottom:8px" onclick="manualSync()">立即同步</button>
      <button class="btn default" style="width:100%" onclick="doSignOut()">登出</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">主控台</h2>
        <p id="pageSubtitle">小型 GP clinic 日常管理</p>
      </div>
      <div class="actions">
        <button class="btn default" onclick="loadDemo()">載入示範資料</button>
        <button class="btn default" onclick="document.getElementById('importInput').click()">匯入 JSON</button>
        <button class="btn default" onclick="exportJSON()">匯出 JSON</button>
        <button class="btn danger" onclick="resetAll()">清除全部資料</button>
        <button class="btn primary" onclick="openCreate('appointment')">+ 快速新增</button>
      </div>
    </div>
    <section id="pageContent"></section>
  </main>
</div>

<input id="importInput" type="file" accept="application/json" hidden onchange="importJSON(event)" />

<div id="modalBackdrop" class="modal-backdrop"></div>
<div id="recordModal" class="modal">
  <div class="modal-head">
    <div>
      <h3 id="modalTitle">新增資料</h3>
      <p id="modalSubtitle">請填寫表格</p>
    </div>
    <button class="btn default" onclick="closeModal()">關閉</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot">
    <button class="btn default" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="saveRecord()">儲存</button>
  </div>
</div>

<div id="drawerBackdrop" class="drawer-backdrop" onclick="closePatientDrawer()"></div>
<div id="patientDrawer" class="drawer">
  <div class="drawer-head">
    <div>
      <h3 id="drawerTitle">病人詳細</h3>
      <p id="drawerSubtitle">病人資料</p>
    </div>
    <button class="btn default" onclick="closePatientDrawer()">關閉</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div id="toast" class="toast"></div>
<div id="printArea" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* ---------- 工具函式 ---------- */
function uid(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`; }
function todayInput() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function nowDateTimeInput() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function shiftDateTime(days, hour, minute) { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(hour, minute, 0, 0); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function formatDate(v) { if (!v) return "—"; const d = new Date(v); if (isNaN(d.getTime())) return "—"; return new Intl.DateTimeFormat("zh-HK", { year:"numeric", month:"2-digit", day:"2-digit" }).format(d); }
function formatDateTime(v) { if (!v) return "—"; const d = new Date(v); if (isNaN(d.getTime())) return "—"; return new Intl.DateTimeFormat("zh-HK", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).format(d); }
function formatMoney(n) { return "HK$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits:0, maximumFractionDigits:2 }); }
function sameDate(a, b) { if (!a || !b) return false; return String(a).slice(0,10) === String(b).slice(0,10); }
function monthKey(v){ return String(v || "").slice(0,7); }
function yearKey(v){ return String(v || "").slice(0,4); }
function calculateAge(dob){ if(!dob) return "—"; const birth = new Date(dob); if(isNaN(birth.getTime())) return "—"; const today = new Date(); let age = today.getFullYear() - birth.getFullYear(); const m = today.getMonth() - birth.getMonth(); if(m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--; return age; }
function escapeHtml(str) { return String(str ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function escapeAttr(str) { return escapeHtml(str).replaceAll("`","&#096;"); }
function toast(message, color) { const el = document.getElementById("toast"); el.textContent = message; el.style.background = color || "#0f172a"; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); }
function badgeClass(status) {
  const map = { "普通科":"blue", "覆診":"violet", "文件":"amber", "已預約":"blue", "已到達":"emerald", "診症中":"violet", "已完成":"emerald", "取消":"slate", "失約":"amber", "已付款":"emerald", "部分付款":"amber", "未付款":"rose", "男":"blue", "女":"rose", "開放":"blue", "進行中":"violet", "完成":"emerald", "低":"slate", "普通":"blue", "高":"orange", "緊急":"rose" };
  return map[status] || "slate";
}
function badge(text) { return `<span class="badge ${badgeClass(text)}">${escapeHtml(text)}</span>`; }

/* ---------- 儲存層：localStorage 做快取 + Supabase 做雲端 ---------- */
function saveStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  queueCloudSave();
}
function loadLocalCache() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function normalizeData(parsed) {
  const base = emptyData();
  if (!parsed) return base;
  return {
    settings: Object.assign({}, base.settings, parsed.settings || {}),
    patients: parsed.patients || [],
    appointments: parsed.appointments || [],
    consultations: parsed.consultations || [],
    bills: parsed.bills || [],
    documents: parsed.documents || [],
    medications: parsed.medications || [],
    followups: parsed.followups || []
  };
}
function setSyncStatus(kind, text){
  const b = document.getElementById("syncBadge");
  if(!b) return;
  b.className = "sync-badge " + kind;
  const t = document.getElementById("syncText");
  if(t) t.textContent = text || (kind==="ok"?"已同步":kind==="saving"?"同步中...":"同步失敗");
}
function nowTimeShort(){ const d = new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function queueCloudSave(){
  if(suppressCloudSave || !sb || !currentUser) return;
  setSyncStatus("saving","同步中...");
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(cloudSaveNow, 900);
}
async function cloudSaveNow(){
  if(!sb || !currentUser){ setSyncStatus("error","未登入"); return; }
  try{
    const { error } = await sb.from(CLINIC_TABLE).upsert({
      doctor_id: currentUser.id,
      data: state.data,
      updated_at: new Date().toISOString()
    });
    if(error){ console.warn(error); setSyncStatus("error","同步失敗"); return; }
    setSyncStatus("ok","已同步 " + nowTimeShort());
  }catch(e){ console.warn(e); setSyncStatus("error","同步失敗"); }
}
async function cloudLoad(){
  if(!sb || !currentUser) return null;
  try{
    const { data, error } = await sb.from(CLINIC_TABLE).select("data").eq("doctor_id", currentUser.id).maybeSingle();
    if(error){ console.warn(error); return null; }
    return data ? data.data : null;
  }catch(e){ console.warn(e); return null; }
}
async function manualSync(){
  await cloudSaveNow();
  toast("已嘗試同步","#2563eb");
}

/* ---------- 登入 / 登出 ---------- */
function initSupabaseClient(){
  if(!SUPABASE_URL || SUPABASE_URL.indexOf("PASTE_") === 0 || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf("PASTE_") === 0){
    return false;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}
async function handleLoginSubmit(e){
  e.preventDefault();
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  if(!sb){ errEl.textContent = "尚未設定 Supabase，請檢查 HTML 頂部嘅 URL / anon key。"; return; }
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = "登入失敗：" + error.message; return; }
  currentUser = data.user;
  await bootAfterLogin();
}
async function doSignOut(){
  if(sb) await sb.auth.signOut();
  currentUser = null;
  document.getElementById("appRoot").style.display = "none";
  document.getElementById("authScreen").style.display = "flex";
  document.getElementById("loginEmail").value = "";
  document.getElementById("loginPassword").value = "";
}
async function handleForgotPassword(){
  const email = document.getElementById("loginEmail").value.trim();
  if(!email){ toast("請先喺 Email 欄填返你嘅電郵", "#d97706"); return; }
  if(!sb){ toast("尚未設定 Supabase", "#e11d48"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error){ toast("發送失敗：" + error.message, "#e11d48"); return; }
  toast("已發送重設密碼電郵，請check inbox", "#059669");
}
async function bootAfterLogin(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "";
  document.getElementById("loggedInEmail").textContent = currentUser ? currentUser.email : "";
  setSyncStatus("saving","讀取雲端資料中...");
  const cloud = await cloudLoad();
  suppressCloudSave = true;
  state.data = cloud ? normalizeData(cloud) : normalizeData(loadLocalCache());
  loadImagesFromLocal();
  renderNav();
  render();
  suppressCloudSave = false;
  if(cloud){ setSyncStatus("ok","已從雲端載入"); }
  else { setSyncStatus("ok","本機資料（等待首次上傳）"); queueCloudSave(); }
}
async function startApp(){
  const ok = initSupabaseClient();
  document.getElementById("authScreen").style.display = "flex";
  if(!ok){ toast("請先喺 HTML 頂部填寫 Supabase URL 同 anon key", "#d97706"); return; }
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      currentUser = data.session.user;
      await bootAfterLogin();
    }
  }catch(e){ console.warn(e); }
  sb.auth.onAuthStateChange((event) => {
    if(event === "SIGNED_OUT"){
      currentUser = null;
      document.getElementById("appRoot").style.display = "none";
      document.getElementById("authScreen").style.display = "flex";
    }
  });
}

/* ---------- 圖片上傳（Logo / 簽名，只存本機，唔上傳 Supabase） ---------- */
function getStoredImages(){ try{ return JSON.parse(localStorage.getItem(IMG_STORAGE_KEY) || "{}"); }catch(e){ return {}; } }
function saveStoredImages(obj){ try{ localStorage.setItem(IMG_STORAGE_KEY, JSON.stringify(obj)); }catch(e){ toast("圖片太大，未能儲存喺本機", "#e11d48"); } }
function handleImageUploadEvent(key, event){
  const file = event.target.files && event.target.files[0];
  if(file) processImageFile(key, file);
  event.target.value = "";
}
function processImageFile(key, file){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 320;
      let dataUrl = ev.target.result;
      if(img.width > maxW){
        const canvas = document.createElement("canvas");
        const ratio = maxW / img.width;
        canvas.width = maxW;
        canvas.height = Math.round(img.height * ratio);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        dataUrl = canvas.toDataURL("image/png");
      }
      const stored = getStoredImages();
      stored[key] = dataUrl;
      saveStoredImages(stored);
      applyImagePreview(key, dataUrl);
      toast("圖片已上載（只存喺呢部電腦）", "#059669");
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function removeStoredImage(key){
  const stored = getStoredImages();
  delete stored[key];
  saveStoredImages(stored);
  applyImagePreview(key, "");
}
function applyImagePreview(key, dataUrl){
  const zone = document.getElementById("imgZone_" + key);
  const thumb = document.getElementById("imgThumb_" + key);
  if(zone && thumb){ thumb.src = dataUrl || ""; zone.classList.toggle("has-img", !!dataUrl); }
}
function loadImagesFromLocal(){
  const stored = getStoredImages();
  applyImagePreview("logo", stored.logo || "");
  applyImagePreview("signature", stored.signature || "");
}
function getLogoDataUrl(){ return getStoredImages().logo || ""; }
function getSignatureDataUrl(){ return getStoredImages().signature || ""; }

function getStats() {
  const today = todayInput();
  const todayAppt = state.data.appointments.filter(a => sameDate(a.dateTime, today));
  const waiting = todayAppt.filter(a => ["已到達","診症中"].includes(a.status));
  const done = todayAppt.filter(a => a.status === "已完成");
  const todayIncome = state.data.bills.filter(b => sameDate(b.date, today)).reduce((sum, b) => sum + Number(b.paid || 0), 0);
  const outstanding = state.data.bills.reduce((sum, b) => sum + Math.max(0, Number(b.amount || 0) - Number(b.paid || 0)), 0);
  return { todayAppt, waiting, done, todayIncome, outstanding };
}

/* ---------- Reports ---------- */
function renderReports() {
  const today = todayInput();
  const thisMonth = monthKey(today);
  const thisYear = yearKey(today);
  const dailyBills = state.data.bills.filter(b => sameDate(b.date, today));
  const monthlyBills = state.data.bills.filter(b => monthKey(b.date) === thisMonth);
  const yearlyBills = state.data.bills.filter(b => yearKey(b.date) === thisYear);
  const dailyPaid = dailyBills.reduce((s,b)=>s+Number(b.paid||0),0);
  const monthlyPaid = monthlyBills.reduce((s,b)=>s+Number(b.paid||0),0);
  const yearlyPaid = yearlyBills.reduce((s,b)=>s+Number(b.paid||0),0);
  const dailyBilled = dailyBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const monthlyBilled = monthlyBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const yearlyBilled = yearlyBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const outstanding = state.data.bills.reduce((s,b)=>s+Math.max(0, Number(b.amount||0)-Number(b.paid||0)),0);
  return `
    <div class="grid-4">
      <div class="stat-card"><div class="label">今日實收</div><div class="value">${formatMoney(dailyPaid)}</div></div>
      <div class="stat-card"><div class="label">本月實收</div><div class="value">${formatMoney(monthlyPaid)}</div></div>

          <div class="list-item"><div><div class="item-title">單數</div><div class="item-sub">${dailyBills.length}</div></div></div>
        </div></div>
      </div>
      <div class="card"><div class="card-head"><div><h3>每月結數</h3><p>${escapeHtml(thisMonth)}</p></div></div>
        <div class="card-body"><div class="list">
          <div class="list-item"><div><div class="item-title">應收</div><div class="item-sub">${formatMoney(monthlyBilled)}</div></div></div>
          <div class="list-item"><div><div class="item-title">實收</div><div class="item-sub">${formatMoney(monthlyPaid)}</div></div></div>
          <div class="list-item"><div><div class="item-title">單數</div><div class="item-sub">${monthlyBills.length}</div></div></div>
        </div></div>
      </div>
      <div class="card"><div class="card-head"><div><h3>每年結數</h3><p>${escapeHtml(thisYear)}</p></div></div>
        <div class="card-body"><div class="list">
          <div class="list-item"><div><div class="item-title">應收</div><div class="item-sub">${formatMoney(yearlyBilled)}</div></div></div>

/* ---------- Modal：新增 / 編輯 ---------- */
function openCreate(type) {
  state.recordType = type;
  state.editId = null;
  resetForm(type);
  renderForm();
  document.getElementById("modalTitle").textContent = `新增${recordTypeLabel(type)}`;
  document.getElementById("modalSubtitle").textContent = "請填寫資料";
  document.getElementById("recordModal").classList.add("show");
  document.getElementById("modalBackdrop").classList.add("show");
}
function openEdit(type, id) {
  state.recordType = type;
  state.editId = id;
  let item = null;
  if (type === "patient") item = state.data.patients.find(x => x.id === id);
  if (type === "appointment") item = state.data.appointments.find(x => x.id === id);
  if (type === "consultation") item = state.data.consultations.find(x => x.id === id);
  if (type === "bill") item = state.data.bills.find(x => x.id === id);
  if (type === "medication") item = state.data.medications.find(x => x.id === id);
  if (type === "followup") item = state.data.followups.find(x => x.id === id);
  state.form = JSON.parse(JSON.stringify(item || {}));
  renderForm();
  document.getElementById("modalTitle").textContent = `編輯${recordTypeLabel(type)}`;
  document.getElementById("modalSubtitle").textContent = "修改資料";
  document.getElementById("recordModal").classList.add("show");
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal() {
  document.getElementById("recordModal").classList.remove("show");
  document.getElementById("modalBackdrop").classList.remove("show");
}
function recordTypeLabel(type) {
  const map = { patient:"病人", appointment:"預約", consultation:"診症", bill:"收費", medication:"藥物", followup:"Follow-up" };
  return map[type] || type;
}
function resetForm(type) {
  if (type === "patient") state.form = { patientId: autoPatientCode(), nameZh: "", nameEn: "", gender: "男", dob: "", hkid: "", phone: "", address: "", allergy: "", chronic: "", alert: "", notes: "" };
  if (type === "appointment") state.form = { patientId: "", patientName: "", dateTime: nowDateTimeInput(), type: "普通科", status: "已預約", complaint: "", notes: "" };
  if (type === "consultation") state.form = { patientId: "", patientName: "", appointmentId: "", dateTime: nowDateTimeInput(), complaint: "", bp: "", pulse: "", temp: "", weight: "", history: "", exam: "", diagnosis: "", rx: "", plan: "", followupDate: "", notes: "" };
  if (type === "bill") state.form = { id: autoBillCode(), patientId: "", patientName: "", date: todayInput(), item: "", amount: "", paid: "", method: "現金", notes: "" };
  if (type === "medication") state.form = { name:"", generic:"", dosage:"", form:"tablet", instruction:"", qty:"", price:"", active:true };
  if (type === "followup") state.form = { patientId:"", patientName:"", dueAt: nowDateTimeInput(), category:"WhatsApp", priority:"普通", status:"開放", subject:"", note:"" };
}
function setFormValue(key, value) { state.form[key] = value; }
function selectPatientForForm(patientId) {
  const p = getPatientById(patientId);
  state.form.patientId = patientId;
  state.form.patientName = p ? patientDisplayName(p) : "";
  renderForm();
}
function selectAppointmentForConsultation(appointmentId) {
  const a = state.data.appointments.find(x => x.id === appointmentId);
  state.form.appointmentId = appointmentId;
  if (a) { state.form.patientId = a.patientId; state.form.patientName = a.patientName; state.form.complaint = a.complaint || ""; }
  renderForm();
}
function appendMedicationToConsult(id){
  const m = getMedicationById(id); if(!m) return;
  const line = `${m.name} | ${m.instruction || ""} | ${m.qty || ""}`;
  state.form.rx = state.form.rx ? `${state.form.rx}\n${line}` : line;
  renderForm();
}
function appendQuickRxTemplate(idx){
  const t = rxQuickPickDefault[idx]; if(!t) return;
  state.form.rx = state.form.rx ? `${state.form.rx}\n${t.text}` : t.text;
  renderForm();
}
function appendMedicationToDoc(id){
  const m = getMedicationById(id); if(!m) return;
  const line = `${m.name} | ${m.instruction || ""} | ${m.qty || ""}`;
  state.doc.rxLines = state.doc.rxLines ? `${state.doc.rxLines}\n${line}` : line;
  renderPage();
}

function saveRecord() {
  const type = state.recordType;
  const f = JSON.parse(JSON.stringify(state.form));
  if (type === "patient") {
    if (!f.patientId || (!f.nameZh && !f.nameEn)) return toast("請填寫病歷號及姓名", "#d97706");
    const item = { ...f, id: state.editId || uid("PAT"), createdAt: f.createdAt || new Date().toISOString() };
    if (state.editId) state.data.patients = state.data.patients.map(x => x.id === state.editId ? item : x);
    else state.data.patients.unshift(item);
  }
  if (type === "appointment") {
    if (!f.patientId || !f.dateTime) return toast("請選擇病人及日期時間", "#d97706");
    const p = getPatientById(f.patientId);
    const item = { ...f, id: state.editId || uid("APT"), patientName: p ? patientDisplayName(p) : f.patientName, createdAt: f.createdAt || new Date().toISOString() };
    if (state.editId) state.data.appointments = state.data.appointments.map(x => x.id === state.editId ? item : x);
    else state.data.appointments.unshift(item);
  }
  if (type === "consultation") {
    if (!f.patientId || !f.dateTime) return toast("請選擇病人及日期時間", "#d97706");
    const p = getPatientById(f.patientId);
    const item = { ...f, id: state.editId || uid("CON"), patientName: p ? patientDisplayName(p) : f.patientName, createdAt: f.createdAt || new Date().toISOString() };
    if (state.editId) state.data.consultations = state.data.consultations.map(x => x.id === state.editId ? item : x);
    else state.data.consultations.unshift(item);
    if (item.appointmentId) state.data.appointments = state.data.appointments.map(a => a.id === item.appointmentId ? { ...a, status:"已完成" } : a);
  }
  if (type === "bill") {
    if (!f.patientId || !f.date || !f.item) return toast("請填寫病人、日期及項目", "#d97706");
    const p = getPatientById(f.patientId);
    const amount = Number(f.amount || 0);
    const paid = Number(f.paid || 0);
    const item = { ...f, id: f.id || state.editId || uid("INV"), patientName: p ? patientDisplayName(p) : f.patientName, amount, paid, status: billStatus(amount, paid), createdAt: f.createdAt || new Date().toISOString() };
    if (state.editId) state.data.bills = state.data.bills.map(x => x.id === state.editId ? item : x);
    else state.data.bills.unshift(item);
  }
  if (type === "medication") {
    if (!f.name) return toast("請填寫藥名", "#d97706");
    const item = { ...f, id: state.editId || uid("MED"), price: Number(f.price || 0) };
    if (state.editId) state.data.medications = state.data.medications.map(x => x.id === state.editId ? item : x);
    else state.data.medications.unshift(item);
  }
  if (type === "followup") {
    if (!f.patientId || !f.dueAt || !f.subject) return toast("請填寫病人、時間及主題", "#d97706");
    const p = getPatientById(f.patientId);
    const item = { ...f, id: state.editId || uid("FU"), patientName: p ? patientDisplayName(p) : f.patientName, createdAt: f.createdAt || new Date().toISOString() };
    if (state.editId) state.data.followups = state.data.followups.map(x => x.id === state.editId ? item : x);
    else state.data.followups.unshift(item);
  }
  closeModal();
  render();
  toast("已儲存", "#059669");
}
function deleteRecord(type, id) {
  if (!confirm("確定刪除？")) return;
  if (type === "patient") state.data.patients = state.data.patients.filter(x => x.id !== id);
  if (type === "appointment") state.data.appointments = state.data.appointments.filter(x => x.id !== id);
  if (type === "consultation") state.data.consultations = state.data.consultations.filter(x => x.id !== id);
  if (type === "bill") state.data.bills = state.data.bills.filter(x => x.id !== id);
  if (type === "document") state.data.documents = state.data.documents.filter(x => x.id !== id);

}

function setDocValue(key, value) {
  state.doc[key] = value;
  recalcSickDays();
  if (state.page === "documents") renderPage();
}
function recalcSickDays() {
  if (state.doc.type !== "sick") return;
  if (!state.doc.sickFrom || !state.doc.sickTo) return;
  const from = new Date(state.doc.sickFrom + "T00:00:00");
  const to = new Date(state.doc.sickTo + "T00:00:00");
  const diff = Math.floor((to - from) / 86400000) + 1;
  if (diff > 0) state.doc.sickDays = diff;
}
function docTypeLabel(type) {
  const map = { sick:"病假紙", attendance:"到診證明", referral:"轉介信", prescription:"處方" };
  return map[type] || type;
}
function getDocPatient() { return getPatientById(state.doc.patientId); }
function parseRxLines(raw) {
  return String(raw || "").split("\n").map(x => x.trim()).filter(Boolean).map(line => {
    const parts = line.split("|").map(x => x.trim());
    return { name: parts[0] || "", usage: parts[1] || "", qty: parts[2] || "" };
  });
}

        <div class="list-item"><div><div class="item-title">診症記錄</div><div class="item-sub">${consultations.length} 筆</div></div></div>
        <div class="list-item"><div><div class="item-title">收費記錄</div><div class="item-sub">${bills.length} 筆</div></div></div>
        <div class="list-item"><div><div class="item-title">Follow-up</div><div class="item-sub">${followups.length} 筆</div></div></div>
      </div>
    </div>
    <div class="subtab ${state.drawerTab==='appointments'?'active':''}">
      <div class="list">
        ${ appointments.length===0 ? `<div class="empty">未有預約</div>` :
          appointments.map(a => `
            <div class="list-item">
              <div><div class="item-title">${formatDateTime(a.dateTime)} · ${escapeHtml(a.complaint || a.type)}</div><div class="item-sub">${badge(a.type)} ${badge(a.status)}</div></div>
              <button class="icon-btn" onclick="openEdit('appointment','${a.id}')">編輯</button>
            </div>`).join("")
        }
      </div>
    </div>
    <div class="subtab ${state.drawerTab==='consultations'?'active':''}">
      <div class="list">
        ${ consultations.length===0 ? `<div class="empty">未有診症記錄</div>` :
          consultations.map(c => `
            <div class="list-item">
              <div>
                <div class="item-title">${formatDateTime(c.dateTime)} · ${escapeHtml(c.diagnosis || "—")}</div>
                <div class="item-sub">主訴：${escapeHtml(c.complaint || "—")}</div>
                <div class="item-sub">處方：${escapeHtml(c.rx || "—")}</div>
              </div>
              <div class="table-actions">
                <button class="icon-btn" onclick="openEdit('consultation','${c.id}')">編輯</button>
                <button class="icon-btn" onclick="prepareDocFromConsult('${c.id}')">文件</button>
              </div>
            </div>`).join("")
        }
      </div>
    </div>
    <div class="subtab ${state.drawerTab==='billing'?'active':''}">
      <div class="list">
        ${ bills.length===0 ? `<div class="empty">未有收費記錄</div>` :
          bills.map(b => `
            <div class="list-item">
              <div>
                <div class="item-title">${escapeHtml(b.id)} · ${escapeHtml(b.item)}</div>
                <div class="item-sub">${formatDate(b.date)} · 金額 ${formatMoney(b.amount)} · 已收 ${formatMoney(b.paid)}</div>
                <div style="margin-top:8px">${badge(b.status)}</div>
              </div>
              <div class="table-actions">
                <button class="icon-btn" onclick="printReceipt('${b.id}')">收據</button>
                <button class="icon-btn" onclick="openEdit('bill','${b.id}')">編輯</button>
              </div>
            </div>`).join("")
        }
      </div>
    </div>
    <div class="subtab ${state.drawerTab==='followups'?'active':''}">
      <div class="list">
        ${ followups.length===0 ? `<div class="empty">未有 Follow-up</div>` :
          followups.map(f => `
            <div class="list-item">
              <div>
                <div class="item-title">${formatDateTime(f.dueAt)} · ${escapeHtml(f.subject)}</div>
                <div class="item-sub">${escapeHtml(f.category)} · ${escapeHtml(f.note || "—")}</div>
                <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">${badge(f.priority)} ${badge(f.status)}</div>
              </div>
              <div class="table-actions">
                <button class="icon-btn" onclick="openWhatsAppFollowup('${f.id}')">WhatsApp</button>
                <button class="icon-btn" onclick="openEdit('followup','${f.id}')">編輯</button>
              </div>
            </div>`).join("")
        }
      </div>
    </div>
  `;
}
function openWhatsAppFollowup(id){
  const f = state.data.followups.find(x => x.id === id); if(!f) return;
  const p = getPatientById(f.patientId);
  if(!p || !p.phone) return toast("病人未有電話號碼", "#d97706");
  const phone = String(p.phone).replace(/\D/g,"");
  const msg = encodeURIComponent(`你好，${p.nameZh || p.nameEn || ""}，${f.subject || "跟進"}。${f.note || ""}`);
  window.open(`https://wa.me/852${phone}?text=${msg}`, "_blank");
}

/* ---------- Settings 儲存 ---------- */
function updateSetting(key, value) { state.data.settings[key] = value; }
function saveSettings() { saveStorage(); render(); toast("設定已儲存", "#059669"); }

/* ---------- 匯入 / 匯出 / Demo / 清除 ---------- */
function exportJSON() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "solo-gp-clinic-data.json"; a.click();
  URL.revokeObjectURL(url);
  toast("已匯出 JSON", "#2563eb");
}
function importJSON(event) {
  const file = event.target.files && event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      state.data = normalizeData(parsed);
      render();
      toast("已匯入 JSON", "#059669");
    } catch (err) { toast("JSON 格式錯誤", "#e11d48"); }
  };
  reader.readAsText(file);
  event.target.value = "";
}
function loadDemo() { state.data = seedData(); state.doc = defaultDocForm(); render(); toast("已載入示範資料", "#2563eb"); }
function resetAll() {
  if (!confirm("確定清除全部資料？（本機同雲端都會清空，此動作不能復原）")) return;
  state.data = emptyData();
  state.doc = defaultDocForm();
  localStorage.removeItem(STORAGE_KEY);
  render();
  toast("全部資料已清除", "#e11d48");
}

/* ---------- 啟動 ---------- */
startApp();
</script>
</body>
</html>
